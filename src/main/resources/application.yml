management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
app:
  auth:
    token-endpoint-enabled: ${TOKEN_ENDPOINT_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-for-local-dev-only}
    expiration-ms: 3600000
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/seat_reservation
    username: reservation
    password: reservation
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

