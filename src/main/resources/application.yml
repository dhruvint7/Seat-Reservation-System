app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-for-local-dev-only}
    expiration-ms: 3600000
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/seat_reservation
    username: reservation
    password: reservation
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
