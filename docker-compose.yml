services:
  mysql:
    image: mysql:8.4
    container_name: seat-reservation-mysql
    environment:
      MYSQL_DATABASE: seat_reservation
      MYSQL_USER: reservation
      MYSQL_PASSWORD: reservation
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: seat-reservation-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/seat_reservation
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: reservation
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENDPOINT_ENABLED: "false"

volumes:
  mysql_data: